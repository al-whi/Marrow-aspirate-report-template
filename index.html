<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bone Marrow Report Builder</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    max-width: 900px;
  }
  h2, h3 { margin-top: 25px; }
  label { font-weight: bold; margin-top: 12px; display: block; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    padding: 6px;
    margin-top: 4px;
    box-sizing: border-box;
  }
  textarea { height: 70px; }
  .small { width: 80px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1 1 120px; }
  #output { height: 260px; white-space: pre-wrap; font-family: monospace; }
  button { margin-top: 15px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button:hover { background-color: #f0f0f0; }
  .copy-btn { background-color: #e8f4f8; }
  .section-box {
    border: 1px solid #ccc;
    padding: 12px;
    border-radius: 6px;
    margin-top: 15px;
    background: #fafafa;
  }
  .button-group {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
  }
  .feedback {
    margin-top: 10px;
    padding: 8px;
    border-radius: 4px;
    display: none;
  }
  .feedback.success {
    background-color: #d4edda;
    color: #155724;
    display: block;
  }
  .feedback.error {
    background-color: #f8d7da;
    color: #721c24;
    display: block;
  }
</style>
</head>

<body>

<h2>Bone Marrow Report Builder</h2>

<form id="reportForm" onsubmit="event.preventDefault(); buildReport();">

  <!-- BLOOD COUNT -->
  <fieldset>
    <legend><h3>Blood Count</h3></legend>
    <div class="section-box">
      <div class="row">
        <div>
          <label for="hb">Hb:</label>
          <input type="text" id="hb" class="small" aria-label="Hemoglobin">
        </div>
        <div>
          <label for="wcc">WCC:</label>
          <input type="text" id="wcc" class="small" aria-label="White Cell Count">
        </div>
        <div>
          <label for="diffN">Diff N:</label>
          <input type="text" id="diffN" class="small" aria-label="Differential Neutrophils">
        </div>
        <div>
          <label for="diffL">Diff L:</label>
          <input type="text" id="diffL" class="small" aria-label="Differential Lymphocytes">
        </div>
        <div>
          <label for="plt">Plt:</label>
          <input type="text" id="plt" class="small" aria-label="Platelets">
        </div>
      </div>

      <label for="bloodFilm">BLOOD FILM</label>
      <textarea id="bloodFilm" aria-label="Blood Film findings"></textarea>
    </div>
  </fieldset>

  <!-- MARROW ASPIRATE -->
  <fieldset>
    <legend><h3>Marrow Aspirate</h3></legend>
    <div class="section-box">
      <label for="cellularity">CELLULARITY</label>
      <textarea id="cellularity" aria-label="Cellularity findings"></textarea>

      <label for="erythropoiesis">ERYTHROPOIESIS</label>
      <textarea id="erythropoiesis" aria-label="Erythropoiesis findings"></textarea>

      <label for="granulopoiesis">GRANULOPOIESIS</label>
      <textarea id="granulopoiesis" aria-label="Granulopoiesis findings"></textarea>

      <label for="megakaryocytes">MEGAKARYOCYTES</label>
      <textarea id="megakaryocytes" aria-label="Megakaryocytes findings"></textarea>
    </div>
  </fieldset>

  <!-- DIFFERENTIAL -->
  <fieldset>
    <legend><h3>Differential (%)</h3></legend>
    <div class="section-box">
      <div class="row">
        <div>
          <label for="blasts">Blasts:</label>
          <input type="number" id="blasts" class="small" aria-label="Blasts percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="pros">Pros:</label>
          <input type="number" id="pros" class="small" aria-label="Promyelocytes percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="myels">Myels:</label>
          <input type="number" id="myels" class="small" aria-label="Myelocytes percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="metas">Metas:</label>
          <input type="number" id="metas" class="small" aria-label="Metamyelocytes percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="neuts">Neuts:</label>
          <input type="number" id="neuts" class="small" aria-label="Neutrophils percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="eryth">Eryths:</label>
          <input type="number" id="eryth" class="small" aria-label="Erythroid percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="plasma">Plasma:</label>
          <input type="number" id="plasma" class="small" aria-label="Plasma cells percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="eos">Eos:</label>
          <input type="number" id="eos" class="small" aria-label="Eosinophils percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="baso">Basos:</label>
          <input type="number" id="baso" class="small" aria-label="Basophils percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="mono">Mono:</label>
          <input type="number" id="mono" class="small" aria-label="Monocytes percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="lymph">Lymph:</label>
          <input type="number" id="lymph" class="small" aria-label="Lymphocytes percentage" step="0.1" min="0" max="100">
        </div>
        <div>
          <label for="other">Other:</label>
          <input type="number" id="other" class="small" aria-label="Other cells percentage" step="0.1" min="0" max="100">
        </div>
      </div>

      <label for="meRatio">M:E Ratio (auto)</label>
      <input type="text" id="meRatio" class="small" readonly aria-label="Myeloid to Erythroid Ratio">
    </div>
  </fieldset>

  <!-- OTHER SECTIONS -->
  <fieldset>
    <legend><h3>Additional Information</h3></legend>
    <div class="section-box">
      <label for="infiltrate">INFILTRATE</label>
      <textarea id="infiltrate" aria-label="Infiltrate findings"></textarea>

      <label for="ironStain">IRON STAIN</label>
      <textarea id="ironStain" aria-label="Iron stain results"></textarea>

      <label for="conclusion">CONCLUSION</label>
      <textarea id="conclusion" aria-label="Clinical conclusion"></textarea>

      <label for="reportedBy">Reported by</label>
      <input type="text" id="reportedBy" aria-label="Name of person reporting">
    </div>
  </fieldset>

  <div class="button-group">
    <button type="submit">Generate Report</button>
    <button type="button" onclick="clearForm()">Clear Form</button>
  </div>
  <div id="feedback" class="feedback"></div>
</form>

<h3>Final Report</h3>
<div style="position: relative;">
  <textarea id="output" readonly aria-label="Generated bone marrow report"></textarea>
  <button type="button" class="copy-btn" onclick="copyToClipboard()" style="position: absolute; top: 10px; right: 10px; padding: 6px 12px; font-size: 12px;" aria-label="Copy report to clipboard">Copy</button>
</div>

<script>
function val(id) {
  return document.getElementById(id).value.trim();
}

function getNumericValue(id) {
  const value = val(id);
  return value === "" ? 0 : parseFloat(value);
}

function showFeedback(message, type) {
  const feedback = document.getElementById("feedback");
  feedback.textContent = message;
  feedback.className = "feedback " + type;
  setTimeout(() => {
    feedback.className = "feedback";
  }, 3000);
}

function calculateMERatio() {
  const myeloid =
    getNumericValue("blasts") +
    getNumericValue("pros") +
    getNumericValue("myels") +
    getNumericValue("metas") +
    getNumericValue("neuts") +
    getNumericValue("eos") +
    getNumericValue("baso") +
    getNumericValue("mono");

  const erythroid = getNumericValue("eryth");

  if (erythroid === 0) return "N/A";

  return (myeloid / erythroid).toFixed(2);
}

// Auto-update M:E ratio live
document.querySelectorAll("#blasts,#pros,#myels,#metas,#neuts,#eos,#baso,#mono,#eryth")
  .forEach(el => el.addEventListener("input", () => {
    document.getElementById("meRatio").value = calculateMERatio();
  }));

function getFormattedDateTime() {
  const now = new Date();
  const date = now.toLocaleDateString();
  const time = now.toLocaleTimeString();
  return date + " " + time;
}

function buildReport() {
  const lines = [];

  // Add timestamp
  lines.push("Date/Time: " + getFormattedDateTime());
  lines.push("");

  lines.push("BLOOD COUNT: " +
    "Hb " + val("hb") +
    ", WCC " + val("wcc") +
    ", Diff N " + val("diffN") +
    ", Diff L " + val("diffL") +
    ", Plt " + val("plt"));

  lines.push("Blood Film: " + val("bloodFilm"));

  lines.push("");
  lines.push("MARROW ASPIRATE");
  lines.push("Cellularity: " + val("cellularity"));
  lines.push("Erythropoiesis: " + val("erythropoiesis"));
  lines.push("Granulopoiesis: " + val("granulopoiesis"));
  lines.push("Megakaryocytes: " + val("megakaryocytes"));

  lines.push("");
  lines.push("Differential:");
  lines.push(
    "Blasts " + val("blasts") + "%, " +
    "Pros " + val("pros") + "%, " +
    "Myels " + val("myels") + "%, " +
    "Metas " + val("metas") + "%, " +
    "Neuts " + val("neuts") + "%, " +
    "Eryths " + val("eryth") + "%, " +
    "Plasma " + val("plasma") + "%, " +
    "Eos " + val("eos") + "%, " +
    "Basos " + val("baso") + "%, " +
    "Mono " + val("mono") + "%, " +
    "Lymph " + val("lymph") + "%, " +
    "Other " + val("other") + "%"
  );
  lines.push("M:E Ratio: " + calculateMERatio());

  lines.push("");
  lines.push("Infiltrate: " + val("infiltrate"));
  lines.push("Iron Stain: " + val("ironStain"));
  lines.push("");
  lines.push("CONCLUSION: " + val("conclusion"));
  lines.push("");
  lines.push("Reported by: " + val("reportedBy"));
  lines.push("");
  lines.push("Laboratory defined uncertainty of measurement was considered in drawing this conclusion.");

  document.getElementById("output").value = lines.join("\n");
  showFeedback("Report generated successfully!", "success");
}

function clearForm() {
  document.getElementById("reportForm").reset();
  document.getElementById("output").value = "";
  document.getElementById("meRatio").value = "";
  showFeedback("Form cleared.", "success");
}

function copyToClipboard() {
  const output = document.getElementById("output");
  if (output.value === "") {
    showFeedback("No report to copy. Please generate a report first.", "error");
    return;
  }
  
  output.select();
  document.execCommand("copy");
  showFeedback("Report copied to clipboard!", "success");
}
</script>

</body>
</html>
